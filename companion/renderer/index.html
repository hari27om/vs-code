<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Spider-Man Companion — Phase 4 3D test object</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, "Segoe UI", sans-serif;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <script type="module">
    import * as THREE from './three.module.js';

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x000000, 8, 20);

    const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0.8, 6.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000000, 0);
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 1.3);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xffffff, 1.8);
    keyLight.position.set(4, 5, 6);
    scene.add(keyLight);

    const cube = new THREE.Mesh(
      new THREE.BoxGeometry(1.2, 1.2, 1.2),
      new THREE.MeshStandardMaterial({ color: 0x2f8cff, metalness: 0.15, roughness: 0.4 })
    );
    scene.add(cube);

    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(1.8, 0.08, 18, 80),
      new THREE.MeshStandardMaterial({ color: 0xff4d4d, emissive: 0x220000 })
    );
    ring.rotation.x = Math.PI / 2;
    scene.add(ring);

    let last = performance.now();
    function animate(now) {
      requestAnimationFrame(animate);
      const dt = Math.min((now - last) / 1000, 0.03);
      last = now;

      cube.rotation.x += 0.8 * dt;
      cube.rotation.y += 1.1 * dt;
      ring.rotation.z += 0.6 * dt;
      renderer.render(scene, camera);
    }

    animate(performance.now());

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
